services:
  pgsql_db:
    image: postgres:16-alpine
    container_name: pgsql_db
    env_file:
      - ./env/db.env
    environment:
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_vol:/var/lib/postgresql/data
      - ./backend/postgres_db/postgresql.conf:/etc/postgresql/postgresql.conf
    command: -c 'config_file=/etc/postgresql/postgresql.conf'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_api
    env_file: [./env/go.env, ./env/db.env]
    environment:
      - DB_HOST=pgsql_db
    depends_on:
      pgsql_db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  java-web:
    build:
      context: .
      dockerfile: java-web/Dockerfile
    container_name: java_web
    env_file:
      - ./env/java.env
    depends_on:
      go-api:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s


  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      go-api:
        condition: service_healthy
      java-web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  db_vol:
